name: Release Deployment

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version Name (e.g. 1.0.1)'
        required: true
        default: '1.3.0'
      is_prerelease:
        description: 'Is Release Candidate / Prerelease?'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Release APK & Deploy Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Restore Release Signing Key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rykersoft-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/rykersoft-release.jks"
            echo "storePassword=$RELEASE_STORE_PASSWORD"
            echo "keyAlias=$RELEASE_KEY_ALIAS"
            echo "keyPassword=$RELEASE_KEY_PASSWORD"
          } > keystore.properties

      - name: Configure RykerSoft Runtime
        env:
          FIREBASE_API_KEY: ${{ secrets.RYKERSOFT_FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.RYKERSOFT_FIREBASE_APP_ID }}
          FIREBASE_WEB_CLIENT_ID: ${{ secrets.RYKERSOFT_FIREBASE_WEB_CLIENT_ID }}
          FAMILY_GITHUB_TOKEN: ${{ secrets.FAMILY_GITHUB_TOKEN }}
        run: |
          test -n "$FIREBASE_API_KEY"
          test -n "$FIREBASE_APP_ID"
          test -n "$FIREBASE_WEB_CLIENT_ID"
          test -n "$FAMILY_GITHUB_TOKEN"
          printf '%s\n' \
            'GEMINI_API_KEY=unused' \
            "FIREBASE_API_KEY=$FIREBASE_API_KEY" \
            "FIREBASE_APP_ID=$FIREBASE_APP_ID" \
            'FIREBASE_PROJECT_ID=rykersoft-abe84' \
            'FIREBASE_STORAGE_BUCKET=rykersoft-abe84.firebasestorage.app' \
            'FIREBASE_MESSAGING_SENDER_ID=809926103320' \
            'FIREBASE_AUTH_DOMAIN=rykersoft-abe84.firebaseapp.com' \
            "FIREBASE_WEB_CLIENT_ID=$FIREBASE_WEB_CLIENT_ID" \
            "FAMILY_GITHUB_TOKEN=$FAMILY_GITHUB_TOKEN" \
            > .env

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify Release APK Created
        run: |
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "Release APK built successfully."
            ls -lh app/build/outputs/apk/release/app-release.apk
          else
            echo "Error: app-release.apk not found!"
            exit 1
          fi

      - name: Verify Release Identity
        run: |
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          APK="app/build/outputs/apk/release/app-release.apk"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK" | tee apk-signing.txt
          grep -q "Signer #1 certificate SHA-256 digest: f1b2d0a742f03a714a84c42fa503dfd88ad6260938488b18e3cf865cd0ae21d6" apk-signing.txt
          "$BUILD_TOOLS_DIR/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.rykersoft.appmanager'" apk-badging.txt
          grep -q "versionName='${{ inputs.version_name }}'" apk-badging.txt

      - name: Determine Prerelease Flag
        id: prerelease_check
        run: |
          TAG_NAME="v${{ inputs.version_name }}"
          IS_RC="${{ inputs.is_prerelease }}"
          if [[ "$TAG_NAME" == *"-rc"* ]] || [[ "$IS_RC" == "true" ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.version_name }}"
          name: "RykerSoft v${{ inputs.version_name }}"
          prerelease: ${{ steps.prerelease_check.outputs.is_prerelease }}
          files: app/build/outputs/apk/release/app-release.apk
          body: |
            ### RykerSoft Application Manager v${{ inputs.version_name }}
            
            - **Release Artifact**: `app-release.apk`
            - **Package ID**: `com.rykersoft.appmanager`
            
            #### Upgrading
            If you already have RykerSoft installed, download the APK or check for updates inside the RykerSoft app to self-update automatically.
            
            #### Registry Update
            To propagate this release to all RykerSoft clients, update `registry.json` in the `rykergrey/RykerSoft` repository with:
            - `latestVersionName`: `${{ inputs.version_name }}`
            - `latestVersionCode`: `<versionCode>`
            - `apkUrl`: `https://github.com/rykergrey/RykerSoft/releases/download/v${{ inputs.version_name }}/app-release.apk`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
